name: Build Native SDKs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # Android — produces fingerprint_sdk-release.aar
  # ─────────────────────────────────────────────
  build-android-aar:
    name: Build Android AAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.4 (used for OpenCV standalone build)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter precache Android artifacts
        run: flutter precache --android

      - name: Generate example Android project (creates gradlew + Flutter Gradle integration)
        working-directory: fingerprint-sdk/example
        run: |
          flutter pub get
          yes "" | flutter create --platforms android . || true

      - name: Download OpenCV Android SDK, build AAR, and publish to local Maven repo
        run: |
          cd /tmp
          wget -q -O opencv.zip \
            "https://github.com/opencv/opencv/releases/download/4.8.0/opencv-4.8.0-android-sdk.zip"
          unzip -q opencv.zip

          # OpenCV sdk/ is a library MODULE, not a standalone project.
          # We need a root project with buildscript declaring AGP.
          ROOT="/tmp/opencv-build"
          mkdir -p "$ROOT"
          cd "$ROOT"

          # Root settings.gradle
          cat > settings.gradle << 'SETTINGS'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "opencv-android"
          include ':sdk'
          project(':sdk').projectDir = new File('/tmp/OpenCV-android-sdk/sdk')
          SETTINGS

          # Root build.gradle — declare AGP + Kotlin (OpenCV 4.8 uses both)
          cat > build.gradle << 'ROOTBUILD'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.1.4'
              classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
            }
          }
          ROOTBUILD

          # Patch OpenCV sdk/build.gradle for AGP 8.x (first occurrence only):
          #   namespace, aidl + buildConfig (disabled by default in AGP 8),
          #   and kotlinOptions.jvmTarget to match javac's 1.8 target.
          SDK_GRADLE=/tmp/OpenCV-android-sdk/sdk/build.gradle
          sed -i "0,/android {/s/android {/android {\n    namespace 'org.opencv'\n    buildFeatures { aidl true; buildConfig true }/" "$SDK_GRADLE"
          sed -i "0,/compileOptions {/s/compileOptions {/kotlinOptions { jvmTarget = '1.8' }\n    compileOptions {/" "$SDK_GRADLE"

          gradle :sdk:assembleRelease --no-daemon -q

          AAR=$(find /tmp/OpenCV-android-sdk/sdk -name "*.aar" | head -1)
          echo "Found AAR: $AAR"

          # AGP forbids local .aar file dependencies in library projects.
          # Publish OpenCV to a local Maven repo so fingerprint_sdk can reference
          # it with proper Maven coordinates (org.opencv:opencv:4.8.0).
          REPO="$GITHUB_WORKSPACE/fingerprint-sdk/fingerprint_sdk/android/libs-repo"
          mkdir -p "$REPO/org/opencv/opencv/4.8.0"
          cp "$AAR" "$REPO/org/opencv/opencv/4.8.0/opencv-4.8.0.aar"
          cat > "$REPO/org/opencv/opencv/4.8.0/opencv-4.8.0.pom" << 'POM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project>
            <modelVersion>4.0.0</modelVersion>
            <groupId>org.opencv</groupId>
            <artifactId>opencv</artifactId>
            <version>4.8.0</version>
            <packaging>aar</packaging>
          </project>
          POM
          echo "OpenCV published to local Maven repo at $REPO"

      - name: Build fingerprint_sdk release AAR (via example app Gradle)
        working-directory: fingerprint-sdk/example/android
        run: |
          chmod +x gradlew
          ./gradlew :fingerprint_sdk:assembleRelease --no-daemon

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-sdk-android-aar
          path: fingerprint-sdk/fingerprint_sdk/android/build/outputs/aar/fingerprint_sdk-release.aar
          retention-days: 30

  # ─────────────────────────────────────────────
  # iOS — produces fingerprint_sdk.xcframework
  # Flutter must be installed because the plugin imports Flutter
  # ─────────────────────────────────────────────
  build-ios-xcframework:
    name: Build iOS XCFramework
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter precache iOS artifacts
        run: flutter precache --ios

      - name: Get example app dependencies
        working-directory: fingerprint-sdk/example
        run: flutter pub get

      - name: Regenerate iOS native project (creates Podfile + xcodeproj)
        working-directory: fingerprint-sdk/example
        run: yes "" | flutter create --platforms ios . || true

      - name: Patch Podfile for OpenCV2 compatibility
        working-directory: fingerprint-sdk/example/ios
        run: |
          # OpenCV2 ships as a static framework; Flutter's use_frameworks! requires dynamic.
          sed -i '' 's/use_frameworks!/use_frameworks! :linkage => :static/' Podfile

          # CocoaPods rejects multiple post_install blocks, so insert into the existing one.
          # Disable CLANG_ENABLE_MODULES for OpenCV2: its stitching headers define
          # enum { NO, ... } which conflicts with the ObjC NO macro (#define NO 0),
          # causing "expected identifier" errors when Xcode compiles the OpenCV2 module.
          awk '
          /flutter_additional_ios_build_settings[(]target[)]/ {
            print
            print "    if target.name == \"OpenCV2\""
            print "      target.build_configurations.each { |c| c.build_settings[\"CLANG_ENABLE_MODULES\"] = \"NO\" }"
            print "    end"
            next
          }
          { print }
          ' Podfile > Podfile.tmp && mv Podfile.tmp Podfile

          echo "=== Patched Podfile ==="
          cat Podfile

      - name: Pod install
        working-directory: fingerprint-sdk/example/ios
        run: pod install --repo-update

      - name: Archive plugin framework for iOS device (arm64)
        working-directory: fingerprint-sdk/example/ios
        run: |
          set -eo pipefail
          xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme fingerprint_sdk \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/ios-device.xcarchive" \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: Archive plugin framework for iOS Simulator
        working-directory: fingerprint-sdk/example/ios
        run: |
          set -eo pipefail
          xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme fingerprint_sdk \
            -destination "generic/platform=iOS Simulator" \
            -archivePath "$PWD/build/ios-simulator.xcarchive" \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: Locate frameworks and create XCFramework
        working-directory: fingerprint-sdk/example/ios
        run: |
          echo "=== Device archive frameworks ==="
          find "$PWD/build/ios-device.xcarchive" -name "*.framework" | head -20
          echo "=== Simulator archive frameworks ==="
          find "$PWD/build/ios-simulator.xcarchive" -name "*.framework" | head -20

          DEVICE_FW=$(find "$PWD/build/ios-device.xcarchive" \
            -name "fingerprint_sdk.framework" -not -path "*/dSYMs/*" | head -1)
          SIM_FW=$(find "$PWD/build/ios-simulator.xcarchive" \
            -name "fingerprint_sdk.framework" -not -path "*/dSYMs/*" | head -1)

          echo "Device framework: $DEVICE_FW"
          echo "Simulator framework: $SIM_FW"

          xcodebuild -create-xcframework \
            -framework "$DEVICE_FW" \
            -framework "$SIM_FW" \
            -output "$PWD/build/fingerprint_sdk.xcframework"

      - name: Zip XCFramework
        working-directory: fingerprint-sdk/example/ios/build
        run: zip -r fingerprint_sdk.xcframework.zip fingerprint_sdk.xcframework

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-sdk-ios-xcframework
          path: fingerprint-sdk/example/ios/build/fingerprint_sdk.xcframework.zip
          retention-days: 30
