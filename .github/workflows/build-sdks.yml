name: Build Native SDKs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android-aar:
    name: Build Android AAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter precache Android artifacts
        run: flutter precache --android

      - name: Get dependencies
        working-directory: fingerprint-sdk/example
        run: |
          flutter clean
          flutter pub get

      - name: Setup Gradle 8.10 (used for OpenCV standalone build)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10'

      - name: Download OpenCV Android SDK, build AAR, and publish to Maven Local
        run: |
          curl -L -o opencv-4.8.0-android-sdk.zip https://github.com/opencv/opencv/releases/download/4.8.0/opencv-4.8.0-android-sdk.zip
          ls -lh opencv-4.8.0-android-sdk.zip
          unzip -q opencv-4.8.0-android-sdk.zip
          
          cd OpenCV-android-sdk
          
          # 1. Create settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          include ':sdk'
          EOF
          
          # 2. Create root build.gradle to supply the missing plugins and repositories
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
              }
          }
          
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
              tasks.withType(JavaCompile) {
                  sourceCompatibility = "1.8"
                  targetCompatibility = "1.8"
              }
              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions {
                      jvmTarget = "1.8"
                  }
              }
          }
          EOF
          
          # 3. Fix namespace and missing features required by AGP 8.x
          sed -i 's/apply plugin: '"'"'com.android.library'"'"'/apply plugin: '"'"'com.android.library'"'"'\n\nandroid {\n    namespace "org.opencv"\n    buildFeatures {\n        buildConfig = true\n        aidl = true\n    }\n}/g' sdk/build.gradle
          
          echo "Building OpenCV AAR..."
          gradle :sdk:assembleRelease
          
          echo "Publishing OpenCV to Maven Local..."
          mvn install:install-file \
            -Dfile=sdk/build/outputs/aar/sdk-release.aar \
            -DgroupId=org.opencv \
            -DartifactId=opencv \
            -Dversion=4.8.0 \
            -Dpackaging=aar

          # Export OpenCV_DIR so CMake can find OpenCVConfig.cmake during native build
          echo "OpenCV_DIR=$GITHUB_WORKSPACE/OpenCV-android-sdk/sdk/native/jni" >> $GITHUB_ENV
          
      - name: Build fingerprint_sdk AAR
        working-directory: fingerprint-sdk/example/android
        run: |
          chmod +x gradlew
          ./gradlew :fingerprint_sdk:assembleRelease -POpenCV_DIR="${{ env.OpenCV_DIR }}" --no-daemon -x lintVitalRelease

      - name: Build Example APK
        working-directory: fingerprint-sdk/example
        run: |
          flutter build apk --release --no-pub --dart-define=OPENCV_DIR="${{ env.OpenCV_DIR }}"

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-sdk-android-aar
          path: fingerprint-sdk/example/build/fingerprint_sdk/outputs/aar/fingerprint_sdk-release.aar

      - name: Upload Example APK
        uses: actions/upload-artifact@v4
        with:
          name: example-app-apk
          path: fingerprint-sdk/example/build/app/outputs/flutter-apk/app-release.apk
          
      - name: Debug - List all AARs
        run: find . -name "*.aar"

  build-ios-xcframework:
    name: Build iOS XCFramework
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter precache iOS artifacts
        run: flutter precache --ios

      - name: Get dependencies
        working-directory: fingerprint-sdk/example
        run: |
          rm -rf ios/Flutter/Generated.xcconfig
          rm -rf ios/Flutter/flutter_export_environment.sh
          flutter clean
          flutter pub get
          yes "" | flutter create --platforms ios . || true

      - name: Patch Podfile
        working-directory: fingerprint-sdk/example/ios
        run: |
          sed -i '' "1s/^/platform :ios, '13.0'\\n/" Podfile
          cat << 'EOF' > patch_podfile.rb
          data = File.read('Podfile')
          
          # 1. Update existing platform if present, otherwise set to 13.0
          data = data.gsub(/^platform :ios, .*/, "platform :ios, '13.0'")
          
          # 2. Force static linkage for transitive dependencies (OpenCV)
          data = data.gsub(/^\s*use_frameworks!.*/, "use_frameworks! :linkage => :static")
          
          # New Pre-install hook to disable check for transitive static binaries
          pre_patch = <<~RUBY
            if defined?(installer) && installer.respond_to?(:pod_targets)
              installer.pod_targets.each do |target|
                if target.name == 'OpenCV2'
                  target.instance_variable_set(:@host_requires_frameworks, false)
                end
              end
            end
          RUBY
          
          if data.include?('pre_install do |installer|')
            data = data.gsub(/pre_install do \|installer\|/, "pre_install do |installer|\n  " + pre_patch.strip)
          else
            data += "\npre_install do |installer|\n  " + pre_patch.strip + "\nend\n"
          end
          
          # 3. Add or update post_install block to force 13.0 on all pods
          patch = <<~RUBY
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '13.0'
                if target.name == 'OpenCV2'
                  config.build_settings['CLANG_ENABLE_MODULES'] = 'NO'
                end
              end
            end
          RUBY
          
          if data.include?('post_install do |installer|')
            data = data.gsub(/post_install do \|installer\|/, "post_install do |installer|\n  " + patch.strip)
          else
            data += "\npost_install do |installer|\n  " + patch.strip + "\nend\n"
          end
          
          File.write('Podfile', data)
          puts "--- SUCCESSFULLY PATCHED PODFILE (v3.0) ---"
          puts data
          puts "-----------------------"
          EOF
          ruby patch_podfile.rb

      - name: Pod install
        working-directory: fingerprint-sdk/example/ios
        run: pod install --repo-update

      - name: Build iOS device framework
        working-directory: fingerprint-sdk/example/ios
        run: |
          xcodebuild archive -workspace Runner.xcworkspace -scheme fingerprint_sdk \
            -destination "generic/platform=iOS" -archivePath "$PWD/build/ios-device.xcarchive" \
            SKIP_INSTALL=NO BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: Build iOS simulator framework
        working-directory: fingerprint-sdk/example/ios
        run: |
          xcodebuild archive -workspace Runner.xcworkspace -scheme fingerprint_sdk \
            -destination "generic/platform=iOS Simulator" -archivePath "$PWD/build/ios-simulator.xcarchive" \
            SKIP_INSTALL=NO BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: Create XCFramework
        working-directory: fingerprint-sdk/example/ios
        run: |
          DEVICE_FW=$(find "$PWD/build/ios-device.xcarchive" -name "fingerprint_sdk.framework" -not -path "*/dSYMs/*" | head -1)
          SIM_FW=$(find "$PWD/build/ios-simulator.xcarchive" -name "fingerprint_sdk.framework" -not -path "*/dSYMs/*" | head -1)
          xcodebuild -create-xcframework -framework "$DEVICE_FW" -framework "$SIM_FW" \
            -output "$PWD/build/fingerprint_sdk.xcframework"

      - name: Zip XCFramework
        working-directory: fingerprint-sdk/example/ios/build
        run: zip -r fingerprint_sdk.xcframework.zip fingerprint_sdk.xcframework

      - name: Upload XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-sdk-ios-xcframework
          path: fingerprint-sdk/example/ios/build/fingerprint_sdk.xcframework.zip
          retention-days: 30
