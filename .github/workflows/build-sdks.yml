name: Build Native SDKs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # Android — produces fingerprint_sdk-release.aar
  # ─────────────────────────────────────────────
  build-android-aar:
    name: Build Android AAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Download OpenCV Android SDK and build AAR
        run: |
          cd /tmp
          wget -q -O opencv.zip \
            "https://github.com/opencv/opencv/releases/download/4.8.0/opencv-4.8.0-android-sdk.zip"
          unzip -q opencv.zip

          echo "=== Top-level contents ==="
          ls OpenCV-android-sdk/

          # The Android library project root is OpenCV-android-sdk/sdk
          # It does not ship a gradlew wrapper; use the system Gradle instead
          SDK_DIR="/tmp/OpenCV-android-sdk/sdk"
          cd "$SDK_DIR"

          echo "=== SDK contents ==="
          ls .

          # Create a minimal settings.gradle if absent
          [ -f settings.gradle ] || echo 'rootProject.name = "opencv"' > settings.gradle

          gradle assembleRelease --no-daemon -q

          AAR=$(find . -name "*.aar" | head -1)
          echo "Found AAR: $AAR"
          mkdir -p "$GITHUB_WORKSPACE/fingerprint-sdk/fingerprint_sdk/android/libs"
          cp "$AAR" "$GITHUB_WORKSPACE/fingerprint-sdk/fingerprint_sdk/android/libs/opencv.aar"
          echo "Done — OpenCV AAR placed in libs/"

      - name: Build release AAR
        working-directory: fingerprint-sdk/fingerprint_sdk/android
        run: gradle assembleRelease --no-daemon

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-sdk-android-aar
          path: fingerprint-sdk/fingerprint_sdk/android/build/outputs/aar/fingerprint_sdk-release.aar
          retention-days: 30

  # ─────────────────────────────────────────────
  # iOS — produces FingerprintSDK.xcframework
  # (device arm64 + simulator arm64/x86_64)
  # ─────────────────────────────────────────────
  build-ios-xcframework:
    name: Build iOS XCFramework
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: fingerprint-sdk/fingerprint_sdk/ios
        run: xcodegen generate

      - name: Install CocoaPods dependencies
        working-directory: fingerprint-sdk/fingerprint_sdk/ios
        run: pod install --repo-update

      - name: Archive for iOS device (arm64)
        working-directory: fingerprint-sdk/fingerprint_sdk/ios
        run: |
          set -eo pipefail
          xcodebuild archive \
            -workspace FingerprintSDK.xcworkspace \
            -scheme FingerprintSDK \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/ios-device.xcarchive" \
            SKIP_INSTALL=NO

      - name: Archive for iOS Simulator (arm64 + x86_64)
        working-directory: fingerprint-sdk/fingerprint_sdk/ios
        run: |
          set -eo pipefail
          xcodebuild archive \
            -workspace FingerprintSDK.xcworkspace \
            -scheme FingerprintSDK \
            -destination "generic/platform=iOS Simulator" \
            -archivePath "$PWD/build/ios-simulator.xcarchive" \
            SKIP_INSTALL=NO

      - name: Create XCFramework
        working-directory: fingerprint-sdk/fingerprint_sdk/ios
        run: |
          echo "=== Device archive frameworks ==="
          find "$PWD/build/ios-device.xcarchive" -name "*.framework" | head -20
          echo "=== Simulator archive frameworks ==="
          find "$PWD/build/ios-simulator.xcarchive" -name "*.framework" | head -20

          DEVICE_FW=$(find "$PWD/build/ios-device.xcarchive" \
            -name "FingerprintSDK.framework" -not -path "*/dSYMs/*" | head -1)
          SIM_FW=$(find "$PWD/build/ios-simulator.xcarchive" \
            -name "FingerprintSDK.framework" -not -path "*/dSYMs/*" | head -1)

          echo "Device framework: $DEVICE_FW"
          echo "Simulator framework: $SIM_FW"

          xcodebuild -create-xcframework \
            -framework "$DEVICE_FW" \
            -framework "$SIM_FW" \
            -output "$PWD/build/FingerprintSDK.xcframework"

      - name: Zip XCFramework
        working-directory: fingerprint-sdk/fingerprint_sdk/ios/build
        run: zip -r FingerprintSDK.xcframework.zip FingerprintSDK.xcframework

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-sdk-ios-xcframework
          path: fingerprint-sdk/fingerprint_sdk/ios/build/FingerprintSDK.xcframework.zip
          retention-days: 30
