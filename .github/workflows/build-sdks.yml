name: Build Native SDKs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # Android — produces fingerprint_sdk-release.aar
  # ─────────────────────────────────────────────
  build-android-aar:
    name: Build Android AAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build release AAR
        working-directory: fingerprint-sdk/fingerprint_sdk/android
        run: gradle assembleRelease

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-sdk-android-aar
          path: fingerprint-sdk/fingerprint_sdk/android/build/outputs/aar/fingerprint_sdk-release.aar
          retention-days: 30

  # ─────────────────────────────────────────────
  # iOS — produces FingerprintSDK.xcframework
  # (device arm64 + simulator arm64/x86_64)
  # ─────────────────────────────────────────────
  build-ios-xcframework:
    name: Build iOS XCFramework
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: fingerprint-sdk/fingerprint_sdk/ios
        run: xcodegen generate

      - name: Install CocoaPods dependencies
        working-directory: fingerprint-sdk/fingerprint_sdk/ios
        run: pod install --repo-update

      - name: Archive for iOS device (arm64)
        working-directory: fingerprint-sdk/fingerprint_sdk/ios
        run: |
          xcodebuild archive \
            -workspace FingerprintSDK.xcworkspace \
            -scheme FingerprintSDK \
            -destination "generic/platform=iOS" \
            -archivePath build/ios-device.xcarchive \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            | xcpretty

      - name: Archive for iOS Simulator (arm64 + x86_64)
        working-directory: fingerprint-sdk/fingerprint_sdk/ios
        run: |
          xcodebuild archive \
            -workspace FingerprintSDK.xcworkspace \
            -scheme FingerprintSDK \
            -destination "generic/platform=iOS Simulator" \
            -archivePath build/ios-simulator.xcarchive \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            | xcpretty

      - name: Create XCFramework
        working-directory: fingerprint-sdk/fingerprint_sdk/ios
        run: |
          xcodebuild -create-xcframework \
            -framework build/ios-device.xcarchive/Products/Library/Frameworks/FingerprintSDK.framework \
            -framework build/ios-simulator.xcarchive/Products/Library/Frameworks/FingerprintSDK.framework \
            -output build/FingerprintSDK.xcframework

      - name: Zip XCFramework
        working-directory: fingerprint-sdk/fingerprint_sdk/ios/build
        run: zip -r FingerprintSDK.xcframework.zip FingerprintSDK.xcframework

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-sdk-ios-xcframework
          path: fingerprint-sdk/fingerprint_sdk/ios/build/FingerprintSDK.xcframework.zip
          retention-days: 30
