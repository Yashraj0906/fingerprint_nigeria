name: Build Native SDKs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android-aar:
    name: Build Android AAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter precache Android artifacts
        run: flutter precache --android

      - name: Generate example Android project
        working-directory: fingerprint-sdk/example
        run: |
          flutter pub get
          yes "" | flutter create --platforms android . || true

      - name: Fix gradle settings for repository resolution
        working-directory: fingerprint-sdk/example/android
        run: |
          # Remove conflicting repositories from build files
          find . -name "build.gradle.kts" -exec sed -i '/repositories.*{/,/}/{ /google()/d; /mavenCentral()/d; /maven {/,/}/d; }' {} \;
          
          # Ensure settings.gradle.kts has proper repository config
          cat > patch_gradle_settings.py << 'PYTHONEOF'
          import os
          import re

          settings_path = 'settings.gradle.kts'
          if os.path.exists(settings_path):
              with open(settings_path, 'r') as f:
                  content = f.read()
              
              # Remove existing repositories from both blocks
              content = re.sub(r'(pluginManagement\s*\{[^}]*?repositories\s*\{)[^}]*(\})', 
                             r'\1 google(); mavenCentral(); gradlePluginPortal() \2', 
                             content, flags=re.DOTALL)
              
              content = re.sub(r'(dependencyResolutionManagement\s*\{[^}]*?repositories\s*\{)[^}]*(\})', 
                             r'\1 google(); mavenCentral() \2', 
                             content, flags=re.DOTALL)
              
              # If no dependencyResolutionManagement, add it
              if 'dependencyResolutionManagement' not in content:
                  content += '\n\ndependencyResolutionManagement {\n  repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)\n  repositories {\n    google()\n    mavenCentral()\n  }\n}\n'
              
              with open(settings_path, 'w') as f:
                  f.write(content)
              
              print("✅ Patched settings.gradle.kts")
              print(content[:500])
          PYTHONEOF
          
          python3 patch_gradle_settings.py

      - name: Build fingerprint_sdk AAR
        working-directory: fingerprint-sdk/example/android
        run: |
          chmod +x gradlew
          ./gradlew :fingerprint_sdk:assembleRelease --no-daemon -x lintVitalRelease

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-sdk-android-aar
          path: fingerprint-sdk/fingerprint_sdk/android/build/outputs/aar/fingerprint_sdk-release.aar
          retention-days: 30

  build-ios-xcframework:
    name: Build iOS XCFramework
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter precache iOS artifacts
        run: flutter precache --ios

      - name: Get dependencies
        working-directory: fingerprint-sdk/example
        run: |
          flutter pub get
          yes "" | flutter create --platforms ios . || true

      - name: Patch Podfile
        working-directory: fingerprint-sdk/example/ios
        run: |
          sed -i '' 's/use_frameworks!/use_frameworks! :linkage => :static/' Podfile
          awk '/flutter_additional_ios_build_settings/ { print; print "    if target.name == \"OpenCV2\"\n      target.build_configurations.each { |c| c.build_settings[\"CLANG_ENABLE_MODULES\"] = \"NO\" }\n    end"; next } 1' Podfile > Podfile.tmp && mv Podfile.tmp Podfile

      - name: Pod install
        working-directory: fingerprint-sdk/example/ios
        run: pod install --repo-update

      - name: Build iOS device framework
        working-directory: fingerprint-sdk/example/ios
        run: |
          xcodebuild archive -workspace Runner.xcworkspace -scheme fingerprint_sdk \
            -destination "generic/platform=iOS" -archivePath "$PWD/build/ios-device.xcarchive" \
            SKIP_INSTALL=NO BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: Build iOS simulator framework
        working-directory: fingerprint-sdk/example/ios
        run: |
          xcodebuild archive -workspace Runner.xcworkspace -scheme fingerprint_sdk \
            -destination "generic/platform=iOS Simulator" -archivePath "$PWD/build/ios-simulator.xcarchive" \
            SKIP_INSTALL=NO BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: Create XCFramework
        working-directory: fingerprint-sdk/example/ios
        run: |
          DEVICE_FW=$(find "$PWD/build/ios-device.xcarchive" -name "fingerprint_sdk.framework" -not -path "*/dSYMs/*" | head -1)
          SIM_FW=$(find "$PWD/build/ios-simulator.xcarchive" -name "fingerprint_sdk.framework" -not -path "*/dSYMs/*" | head -1)
          xcodebuild -create-xcframework -framework "$DEVICE_FW" -framework "$SIM_FW" \
            -output "$PWD/build/fingerprint_sdk.xcframework"

      - name: Zip XCFramework
        working-directory: fingerprint-sdk/example/ios/build
        run: zip -r fingerprint_sdk.xcframework.zip fingerprint_sdk.xcframework

      - name: Upload XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-sdk-ios-xcframework
          path: fingerprint-sdk/example/ios/build/fingerprint_sdk.xcframework.zip
          retention-days: 30
