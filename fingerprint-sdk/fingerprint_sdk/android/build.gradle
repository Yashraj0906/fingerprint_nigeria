plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    compileSdk 34
    namespace "com.yellowsense.fingerprint_sdk"

    defaultConfig {
        minSdk 21
        targetSdk 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    // Allow importing local AAR files from android/libs/
    repositories {
        flatDir { dirs 'libs' }
    }

    packagingOptions {
        // Avoid duplicate .so conflicts when merging OpenCV native libs
        pickFirst 'lib/*/libopencv_java4.so'
    }
}

repositories {
    flatDir { dirs 'libs' }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // OpenCV 4.8.x AAR — place opencv-android-4.8.x.aar inside android/libs/
    // Download from: https://github.com/opencv/opencv/releases/tag/4.8.0
    implementation(name: 'opencv-android-4.8.x', ext: 'aar')
}
