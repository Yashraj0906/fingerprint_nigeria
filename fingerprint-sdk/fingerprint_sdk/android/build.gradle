plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

def flutterRoot = System.getenv("FLUTTER_ROOT")
if (flutterRoot == null) {
    def properties = new Properties()
    def propertiesFile = project.rootProject.file('local.properties')
    if (propertiesFile.exists()) {
        propertiesFile.withInputStream { properties.load(it) }
        flutterRoot = properties.getProperty('flutter.sdk')
    }
}

if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define flutter.sdk in local.properties or set FLUTTER_ROOT env variable.")
}

apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

android {
    compileSdk 34
    namespace "com.yellowsense.fingerprint_sdk"

    defaultConfig {
        minSdk 21
        targetSdk 34

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17", "-O3", "-fexceptions", "-frtti"
                // OpenCV_DIR: CI sets GITHUB_WORKSPACE; OpenCV is extracted there.
                // We read it at configuration time; empty string disables it gracefully.
                def opencvDir = System.getenv("OpenCV_DIR") ?: ""
                arguments "-DANDROID_STL=c++_shared",
                          "-DOpenCV_DIR=${opencvDir}"
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    packagingOptions {
        pickFirst 'lib/*/libopencv_java4.so'
        pickFirst 'lib/*/libfingerprint_core.so'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

repositories {
    mavenLocal()
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // OpenCV — resolved via mavenLocal() in settings.gradle.
    // CI publishes opencv-4.8.0.aar to Maven Local before building.
    implementation 'org.opencv:opencv:4.8.0'
}
