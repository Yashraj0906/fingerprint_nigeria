plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

def flutterRoot = System.getenv("FLUTTER_ROOT")
if (flutterRoot == null) {
    def properties = new Properties()
    def propertiesFile = project.rootProject.file('local.properties')
    if (propertiesFile.exists()) {
        propertiesFile.withInputStream { properties.load(it) }
        flutterRoot = properties.getProperty('flutter.sdk')
    }
}

if (flutterRoot == null) {
    throw new RuntimeException("Flutter SDK not found. Define flutter.sdk in local.properties or set FLUTTER_ROOT env variable.")
}

def engineVersionFile = new File(flutterRoot, "bin/internal/engine.version")
def engineVersion = "unknown"
if (engineVersionFile.exists()) {
    engineVersion = engineVersionFile.text.trim()
}

android {
    namespace "com.yellowsense.fingerprint_sdk"
    compileSdk 34

    defaultConfig {
        // MediaPipe Tasks Vision (Hand Landmarker) requires minSdk 24+
        minSdk 24
        targetSdk 34

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17", "-O3", "-fexceptions", "-frtti"
                // Pointing to the properly extracted OpenCV Android SDK.
                // On CI, the OpenCV_DIR env var overrides this.
                def opencvDir = System.getenv("OpenCV_DIR") ?: "C:/Users/Yashraj Kumar/fingerprint_nigeria/opencv_sdk_clean/OpenCV-android-sdk/sdk/native/jni"
                arguments "-DANDROID_STL=c++_shared",
                          "-DOpenCV_DIR=${opencvDir}"
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    packagingOptions {
        pickFirst 'lib/*/libc++_shared.so'
        pickFirst 'lib/*/libopencv_java4.so'
        pickFirst 'lib/*/libfingerprint_core.so'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://storage.googleapis.com/download.flutter.io" }
}

dependencies {
    // Use compileOnly to allow the plugin to compile against Flutter classes.
    // It will NOT be bundled into the final app, avoiding duplicate class errors.
    compileOnly "io.flutter:flutter_embedding_release:1.0.0-${engineVersion}"
    
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // OpenCV — local module from the extracted Android SDK (see settings.gradle)
    implementation project(':opencv')

    // MediaPipe Hand Landmarker — handedness + per-finger landmarks (replaces fragile skin-mask heuristics)
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'
}
