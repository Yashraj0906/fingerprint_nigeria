pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'com.android.library' version '8.1.4'
        id 'org.jetbrains.kotlin.android' version '1.9.0'
    }
}

dependencyResolutionManagement {
    repositories {
        // OpenCV is provided via Maven Local (published by CI).
        // Run `mvn install:install-file -Dfile=opencv.aar -DgroupId=org.opencv
        //   -DartifactId=opencv -Dversion=4.8.0 -Dpackaging=aar` for local builds.
        mavenLocal()
        google()
        mavenCentral()
    }
}

rootProject.name = 'fingerprint_sdk'
