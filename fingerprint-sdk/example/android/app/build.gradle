plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.fingerprint_example"
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.example.fingerprint_example"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    // Explicitly add flutter embedding to prevent Kotlin compilation errors
    def flutterRoot = System.getenv("FLUTTER_ROOT")
    if (flutterRoot == null) {
        def properties = new Properties()
        def propertiesFile = project.rootProject.file('local.properties')
        if (propertiesFile.exists()) {
            propertiesFile.withInputStream { properties.load(it) }
            flutterRoot = properties.getProperty('flutter.sdk')
        }
    }
    def engineVersion = "unknown"
    if (flutterRoot != null) {
        def engineVersionFile = new File(flutterRoot, "bin/internal/engine.version")
        if (engineVersionFile.exists()) {
            engineVersion = engineVersionFile.text.trim()
        }
    }
    implementation "io.flutter:flutter_embedding_release:1.0.0-${engineVersion}"
}

repositories {
    maven { url "https://storage.googleapis.com/download.flutter.io" }
    google()
    mavenCentral()
}

flutter {
    source "../.."
}
