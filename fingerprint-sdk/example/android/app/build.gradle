plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.fingerprint_example"
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.example.fingerprint_example"
        // Must be >= fingerprint_sdk (MediaPipe Hand Landmarker)
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        pickFirst 'lib/*/libc++_shared.so'
        pickFirst 'lib/*/libopencv_java4.so'
        pickFirst 'lib/*/libfingerprint_core.so'
    }
}

dependencies {
    // Note: Manual flutter_embedding dependency removed.
    // The 'dev.flutter.flutter-gradle-plugin' handles this automatically.
}

repositories {
    maven { url "https://storage.googleapis.com/download.flutter.io" }
    google()
    mavenCentral()
}

flutter {
    source "../.."
}
