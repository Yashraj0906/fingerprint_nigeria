pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def propertiesFile = file("local.properties")
        if (propertiesFile.exists()) {
            propertiesFile.withInputStream { properties.load(it) }
        }
        def path = properties.getProperty("flutter.sdk")
        if (path == null) {
            path = System.getenv("FLUTTER_ROOT")
        }
        if (path == null) {
            throw new RuntimeException("Flutter SDK not found. Define flutter.sdk in local.properties or set FLUTTER_ROOT env variable.")
        }
        return path
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-gradle-plugin" apply false
    id "com.android.application" version "8.2.0" apply false
    id "org.jetbrains.kotlin.android" version "1.9.24" apply false
}

include ":app"

include ":fingerprint_sdk_standalone"
project(":fingerprint_sdk_standalone").projectDir = new File("../../fingerprint_sdk/android")
