# XcodeGen project definition
# Generate with: xcodegen generate
# CI installs xcodegen via: brew install xcodegen

name: FingerprintSDK
options:
  bundleIdPrefix: com.yellowsense
  deploymentTarget:
    iOS: "13.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_CXX_LIBRARY: libc++
    GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) OPENCV_DISABLE_EIGEN_TENSOR_SUPPORT=1"
    ENABLE_BITCODE: NO

targets:
  FingerprintSDK:
    type: framework
    platform: iOS
    deploymentTarget: "13.0"

    sources:
      # Objective-C++ bridge classes
      - path: Classes
        type: group

      # Shared C++ core (two levels up)
      - path: ../../src
        type: group
        buildPhase: sources

      # Headers
      - path: ../../include
        type: group
        buildPhase: headers
        headerVisibility: project

    settings:
      base:
        PRODUCT_NAME: FingerprintSDK
        DEFINES_MODULE: YES
        SKIP_INSTALL: NO
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        CLANG_ENABLE_MODULES: YES

        # OpenCV framework path injected at build time via OPENCV_FRAMEWORK_PATH env var
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/../../include"
          - "$(OPENCV_FRAMEWORK_PATH)/opencv2.framework/Headers"
        FRAMEWORK_SEARCH_PATHS:
          - "$(OPENCV_FRAMEWORK_PATH)"
        OTHER_LDFLAGS:
          - "-framework opencv2"

        # Code signing (CI: unsigned; release: set in Xcode organiser)
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

    dependencies:
      - framework: $(OPENCV_FRAMEWORK_PATH)/opencv2.framework
        embed: false
        implicit: true
